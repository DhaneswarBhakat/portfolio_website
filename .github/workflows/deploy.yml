name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.3
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Project site is served from https://<user>.github.io/portfolio_website/
      # so the app must know that sub-path. Change to "/" for a user site or a
      # custom domain.
      - run: flutter build web --release --base-href "/portfolio_website/"

      # Single-page app: serve index.html for unknown paths / hard refreshes.
      # .nojekyll stops GitHub stripping folders that start with "_".
      - run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
